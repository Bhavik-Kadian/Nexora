# SecureGate merge gate.
#
# Every pull request to main is scanned for secrets before it can be merged, by four scanners:
# Gitleaks and TruffleHog read every commit of the pull request (a secret that a later commit
# deletes is still in the history), Semgrep and Bandit read the code it changed. SecureGate
# merges their findings and policy.yaml decides. The job is called "secret-gate": that is the
# check to require in the repository's ruleset (see docs/merge-gate.md). It also writes the
# job summary, posts one comment on the pull request, and uploads SARIF for the Security tab.
name: secret-gate

# Run on every pull request to main. There are no path filters on purpose: a required check
# that never runs would leave a pull request waiting forever.
on:
  pull_request:
    branches: [main]

# One run per pull request at a time: a new push cancels the run for the older commits.
concurrency:
  group: secret-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read the code, write one comment on the pull request, and upload SARIF results.
permissions:
  contents: read
  pull-requests: write
  security-events: write

# The scanner versions SecureGate is tested with, in one place. CLAUDE.md lists the same
# versions (a test checks it), and `make scanners` installs them on a laptop. The SHA-256
# values fingerprint each release's list of checksums, recorded when the version was chosen.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_CHECKSUMS_SHA256: "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae"
  TRUFFLEHOG_VERSION: "3.97.9"
  TRUFFLEHOG_CHECKSUMS_SHA256: "d8a2807fd8019f3db10308365bdfc818c07ae86f4e7e22839e41f77f9b27f93f"
  SEMGREP_VERSION: "1.179.0"
  BANDIT_VERSION: "1.9.4"

jobs:
  secret-gate:
    # A fixed image, the one the gate was tested on: ubuntu-latest moves to a new Ubuntu over time.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # GitHub's facts about the pull request, passed as variables so that the scripts below
      # never paste GitHub data straight into a command.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Download the repository with its full history, so that every commit of the pull request
      # can be read. GitHub's access token is not kept in the download.
      - name: Check out the code with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install Python 3.12, the version SecureGate is built and tested with, and keep pip's
      # downloads between runs.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install SecureGate as it is on the base branch (main), not as it is in the pull request,
      # and later use that branch's rules too (policy.yaml, .gitleaks.toml, .trufflehog.yaml,
      # rules/). So a pull request cannot loosen the rules that judge it: changes count once
      # merged.
      - name: Install SecureGate from the base branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/gate" "$BASE_SHA"
          cd "$RUNNER_TEMP/gate"
          pip install -e .

      # Download Gitleaks from its official GitHub release and check the download before using
      # it: first the release's list of checksums against the fingerprint above, then the
      # program archive against its line in that list. Any mismatch stops the job.
      - name: Install Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --remote-name "$release/$checksums"
          echo "$GITLEAKS_CHECKSUMS_SHA256  $checksums" | sha256sum --check --strict
          awk -v name="$archive" '$2 == name' "$checksums" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Download TruffleHog the same way: its official release, checked against the pinned
      # fingerprint of the release's checksums, then against its own line. No install script
      # is piped into a shell.
      - name: Install TruffleHog (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          checksums="trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --remote-name "$release/$checksums"
          echo "$TRUFFLEHOG_CHECKSUMS_SHA256  $checksums" | sha256sum --check --strict
          awk -v name="$archive" '$2 == name' "$checksums" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" trufflehog
          "$RUNNER_TEMP/bin/trufflehog" --version

      # Install the pinned Semgrep and Bandit, the two code checkers.
      - name: Install Semgrep and Bandit (pinned)
        run: |
          pip install "semgrep==${SEMGREP_VERSION}" "bandit==${BANDIT_VERSION}"
          semgrep --version
          bandit --version

      # Scan every commit from the base of the pull request to its head with all four scanners,
      # and write the findings, the summary, the comment and SARIF. The exit code is saved
      # instead of failing right away, so the steps below still run; the last step uses it:
      # 0 = pass, 1 = a secret is blocked (red), 2 = the scan could not finish (also red).
      - name: Scan every commit in this pull request
        id: scan
        run: |
          set +e
          out="$RUNNER_TEMP/securegate"
          gate="$RUNNER_TEMP/gate"
          securegate scan . --mode range --range "$BASE_SHA..$HEAD_SHA" --scanners all \
            --policy "$gate/policy.yaml" \
            --gitleaks-config "$gate/.gitleaks.toml" \
            --trufflehog-config "$gate/.trufflehog.yaml" \
            --semgrep-rules "$gate/rules/securegate-risky.yml" \
            --out "$out/findings.json" \
            --sarif "$out/securegate.sarif" \
            --summary "$out/summary.md" \
            --comment "$out/comment.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Ask SecureGate's AI agents about the findings: triage, a fixed line and an incident plan,
      # kept in findings.json and shown in the summary and the comment as advice. They never
      # decide: the exit code was saved above, and this step may fail without failing the check.
      # The agents never see a whole secret (SecureGate takes every value out first). Without the
      # secret SECUREGATE_AI_KEY (a pull request from a fork, or before it is set), the comment
      # says the agents were not asked.
      - name: Ask the AI agents (advice only)
        if: always() && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1')
        continue-on-error: true
        timeout-minutes: 3
        env:
          SECUREGATE_AI_ENDPOINT: ${{ vars.SECUREGATE_AI_ENDPOINT }}
          SECUREGATE_AI_DEPLOYMENT: ${{ vars.SECUREGATE_AI_DEPLOYMENT }}
          SECUREGATE_AI_KEY: ${{ secrets.SECUREGATE_AI_KEY }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          out="$RUNNER_TEMP/securegate"
          case "$VISIBILITY" in
            public|private) visibility="$VISIBILITY" ;;
            *) visibility=unknown ;;
          esac
          securegate agents --report "$out/findings.json" --visibility "$visibility" \
            --comment "$out/comment.md" --summary "$out/summary.md"

      # Always show the summary on the check's page, even when the job fails. It holds masked
      # values only. This step never changes the result.
      - name: Write the job summary
        if: always()
        continue-on-error: true
        run: |
          summary="$RUNNER_TEMP/securegate/summary.md"
          if [ -s "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### SecureGate: ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo "SecureGate did not write a summary. See the scan step's log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Upload SARIF to the Security tab when the scan finished (exit code 0 or 1). After an
      # error there is no SARIF on purpose: an empty one would mark earlier alerts as fixed.
      # A pull request from a fork has no permission to upload, so it is skipped there.
      - name: Upload SARIF to the Security tab
        if: always() && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1') && env.FROM_FORK == 'false'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/securegate/securegate.sarif
          category: secret-gate

      # Keep findings.json (masked values only) as a download of this run, for the dashboard:
      # `make ci-report` opens it.
      - name: Upload findings.json
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings
          path: ${{ runner.temp }}/securegate/findings.json
          if-no-files-found: warn
          retention-days: 14

      # Post SecureGate's comment on the pull request, or update the one it posted before (it
      # is recognised by its hidden marker), with the job's own token. Pull requests from forks
      # get a read-only token, so they are skipped.
      - name: Post or update the pull request comment
        if: always() && env.FROM_FORK == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment="$RUNNER_TEMP/securegate/comment.md"
          if [ ! -s "$comment" ]; then
            echo "SecureGate wrote no comment to post."
            exit 0
          fi
          marker='<!-- securegate:pr-comment -->'
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id")"
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$comment" > /dev/null
            echo "Updated SecureGate's comment."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$comment" > /dev/null
            echo "Posted SecureGate's comment."
          fi

      # Last: pass or fail the check with SecureGate's exit code. If the scan never ran, the
      # code is missing and the check fails, because the gate never passes without looking.
      - name: Pass or fail the check with SecureGate's exit code
        if: always()
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          code="${SCAN_EXIT:-2}"
          case "$code" in
            0|1|2) ;;
            *) code=2 ;;
          esac
          echo "SecureGate exit code: $code (0 = pass, 1 = blocked, 2 = could not scan)"
          exit "$code"
