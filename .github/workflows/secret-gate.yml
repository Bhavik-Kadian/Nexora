# SecureGate merge gate.
#
# Every pull request is scanned for secrets before it can be merged. Each commit in the pull
# request is checked, not only the final result, because a secret that a later commit deletes
# is still in the history. The job is called "secret-gate": that is the check to require in
# the repository's ruleset (see docs/merge-gate.md).
name: secret-gate

# Run on every pull request. There are no path filters on purpose: a required check that
# never runs would leave a pull request waiting forever.
on:
  pull_request:

# The job only reads the code. It cannot push, comment or change anything.
permissions:
  contents: read

# The other scanners SecureGate is tested with. `make scanners` installs these same versions on
# a laptop (tools/install_scanners.py reads them from here). The job below does not use them yet.
env:
  TRUFFLEHOG_VERSION: "3.97.9"
  # The SHA-256 fingerprint of that TruffleHog release's list of checksums, recorded when this
  # version was chosen.
  TRUFFLEHOG_CHECKSUMS_SHA256: "d8a2807fd8019f3db10308365bdfc818c07ae86f4e7e22839e41f77f9b27f93f"
  SEMGREP_VERSION: "1.179.0"
  BANDIT_VERSION: "1.9.4"

jobs:
  secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Gitleaks version from CLAUDE.md, and the SHA-256 fingerprint of that release's
      # list of checksums, recorded when this version was chosen.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_CHECKSUMS_SHA256: "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae"
      # The first and last commit of the pull request, passed as variables so that the
      # scripts below never paste GitHub data straight into a command.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Download the repository with its full history, so that every commit of the pull request
      # can be read. The job only reads, so GitHub's access token is not kept in the download.
      - name: Check out the code with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install Python 3.12, the version SecureGate is built and tested with.
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Install SecureGate as it is on the base branch (usually main), not as it is in the pull
      # request, and later use that branch's policy.yaml and .gitleaks.toml too. So a pull
      # request cannot loosen the rules that judge it: changes to the gate count once merged.
      - name: Install SecureGate from the base branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/gate" "$BASE_SHA"
          cd "$RUNNER_TEMP/gate"
          pip install -e .

      # Download Gitleaks from its official GitHub release and check the download before using
      # it: first the release's list of checksums against the fingerprint above, then the
      # program archive against its line in that list. Any mismatch stops the job.
      - name: Install Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --remote-name "$release/$archive"
          curl --fail --silent --show-error --location --remote-name "$release/$checksums"
          echo "$GITLEAKS_CHECKSUMS_SHA256  $checksums" | sha256sum --check --strict
          awk -v name="$archive" '$2 == name' "$checksums" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Scan every commit from the base of the pull request to its head. SecureGate's exit code
      # decides the check: 0 = pass, 1 = a secret is blocked (red), 2 = the scan could not run
      # (also red, because the gate never passes when it could not look).
      - name: Scan every commit in this pull request
        run: >-
          securegate scan . --mode range --range "$BASE_SHA..$HEAD_SHA"
          --policy "$RUNNER_TEMP/gate/policy.yaml"
          --gitleaks-config "$RUNNER_TEMP/gate/.gitleaks.toml"
          --out "$RUNNER_TEMP/findings.json"

      # Always write a short summary on the check's page, even when the job fails. It shows
      # masked values only. This step never changes the result: the scan above decides.
      - name: Write the summary
        if: always()
        continue-on-error: true
        run: |
          if ! securegate summary --report "$RUNNER_TEMP/findings.json" >> "$GITHUB_STEP_SUMMARY"; then
            echo "SecureGate could not summarise a finished scan. See the scan step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
