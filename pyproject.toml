[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "securegate"
dynamic = ["version"]
description = "A secret-scanning gate for Git repositories."
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
securegate = "securegate.cli:main"

[tool.setuptools.dynamic]
version = { attr = "securegate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"securegate.demo" = ["catalog.yaml", "templates/*.j2"]
"securegate.ui" = ["templates/*.html", "static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import helpers.py
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W/F: errors, I: import order, B: likely bugs, UP: modern syntax,
# S: security checks (bandit), SIM: simplifications, RUF: ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert, and run git/gitleaks with arguments they build themselves.
"tests/**" = ["S101", "S603", "S607"]
