{#- Line icons drawn inline, so the page loads nothing from elsewhere. They are decoration:
    each one sits next to words that say the same thing. -#}
{% macro icon(name, extra="") -%}
<svg class="icon{% if extra %} {{ extra }}{% endif %}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "lock" -%}
<rect x="4" y="10.5" width="16" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path d="M12 14.5v2.5"/>
{%- elif name == "download" -%}
<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>
{%- elif name == "report" -%}
<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/>
{%- elif name == "shield-alert" -%}
<path d="M12 3l8 3v6c0 4.5-3.4 8.4-8 9-4.6-.6-8-4.5-8-9V6z"/><path d="M12 8v5"/><path d="M12 16.5h.01"/>
{%- elif name == "shield-check" -%}
<path d="M12 3l8 3v6c0 4.5-3.4 8.4-8 9-4.6-.6-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
{%- elif name == "arrow-right" -%}
<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
{%- elif name == "arrow-left" -%}
<path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>
{%- endif -%}
</svg>
{%- endmacro %}
